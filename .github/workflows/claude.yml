name: Claude implementation

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Dependency-ready issue number to implement
        required: true
        type: string

concurrency:
  group: claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  interactive:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.issue.pull_request == null &&
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
      checks: read
    uses: Supershoff/.github/.github/workflows/claude-implement.yml@a08297589d9f215c8456219094659e9922177587
    with:
      max_turns: 300
    secrets: inherit

  automated-implementation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
      checks: read

    steps:
      - name: Validate and claim the requested issue
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'skip=true' >> "${GITHUB_OUTPUT}"
          echo 'started=false' >> "${GITHUB_OUTPUT}"

          issue_json="$(gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json state,labels,title,body)"
          [ "$(jq -r .state <<<"${issue_json}")" = "OPEN" ] || { echo "Issue is already closed; nothing to implement."; exit 0; }
          jq -e '[.labels[].name] | any(. == "ready-for-agent")' <<<"${issue_json}" >/dev/null
          if jq -e '[.labels[].name] | any(. == "automation:needs-attention" or . == "ready-for-human")' <<<"${issue_json}" >/dev/null; then
            echo "Issue is intentionally blocked from autonomous implementation."
            exit 0
          fi

          completed_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --limit 100 \
            --json number,body --jq "first(.[] | select(.body | test(\"(Fixes|Closes|Resolves) #${ISSUE_NUMBER}([^0-9]|$)\"))) | .number // empty")"
          if [ -n "${completed_pr}" ]; then
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:queued --remove-label automation:in-progress \
              --remove-label automation:retry --remove-label automation:needs-attention \
              --add-label automation:ready-for-user-testing
            gh issue close "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Reconciled as completed by merged PR #${completed_pr}."
            echo 'skip=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,body --jq "first(.[] | select(.body | test(\"(Fixes|Closes|Resolves) #${ISSUE_NUMBER}([^0-9]|$)\"))) | .number // empty")"
          if [ -n "${existing_pr}" ]; then
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:queued --add-label automation:in-progress
            echo "Issue already has open PR #${existing_pr}; implementation is already owned."
            exit 0
          fi

          gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --add-label automation:in-progress --remove-label automation:queued --remove-label automation:retry
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Claude implementation attempt started. <!-- claude-implementation-start:${ISSUE_NUMBER}:${GITHUB_RUN_ID} -->"
          echo 'skip=false' >> "${GITHUB_OUTPUT}"
          echo 'started=true' >> "${GITHUB_OUTPUT}"

          dependency_block="$(sed -n '/^## Dependencies$/,/^## Red/p' <<<"$(jq -r .body <<<"${issue_json}")")"
          while read -r dependency; do
            [ -n "${dependency}" ] || continue
            state="$(gh issue view "${dependency}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)"
            [ "${state}" = "CLOSED" ] || { echo "Dependency #${dependency} is ${state}."; exit 1; }
          done < <(grep -oE '#[0-9]+' <<<"${dependency_block}" | tr -d '#' || true)

      - name: Checkout complete repository history
        if: steps.claim.outputs.skip == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Recover an existing implementation branch before spending another attempt
        id: recovery
        if: steps.claim.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          recovered="$(bash .github/scripts/find-cloud-mule-implementation-branch.sh "${ISSUE_NUMBER}")"
          echo "name=${recovered}" >> "${GITHUB_OUTPUT}"
          if [ -n "${recovered}" ]; then
            echo "Recovered existing implementation branch ${recovered}; Claude will not be rerun."
          fi

      - name: Run Claude Code for the issue
        if: steps.claim.outputs.skip == 'false' && steps.recovery.outputs.name == ''
        id: claude
        uses: anthropics/claude-code-action@62529b7c89dbb8cfaa838f2c87f2f8459b46fe68 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions
          base_branch: master
          branch_prefix: claude/
          branch_name_template: "{{prefix}}issue-{{entityNumber}}-{{description}}"
          show_full_output: true
          prompt: >-
            Implement GitHub issue #${{ inputs.issue_number }} completely. First read the issue with
            gh issue view, then read AGENTS.md, CLAUDE.md, CONTEXT.md, IMPLEMENTATION-BRIEF.md,
            applicable ADRs, and docs/agents/automation.md. Follow the issue's Red → Green → Refactor
            sequence: demonstrate failing tests before production behavior, implement only the issue,
            run every relevant available check, and report exact commands/results. Do not weaken,
            skip, or misreport checks. Preserve unrelated work, private DAT boundaries, custody
            invariants, and authority boundaries. Work only on a branch named
            claude/issue-${{ inputs.issue_number }}-<short-description>. Commit and push that branch,
            but do not create a pull request and never merge it; the wrapper workflow owns the handoff.
          additional_permissions: |
            actions: read
            checks: read
          claude_args: |
            --max-turns 300
            --append-system-prompt "Work on exactly one issue. The wrapper, not Claude, creates the pull request. If a required prerequisite is unavailable or an acceptance criterion cannot be verified, stop and report it instead of claiming completion."
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pwd:*),Bash(ls:*),Bash(find:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(rg:*),Bash(sed:*),Bash(sort:*),Bash(wc:*),Bash(which:*),Bash(git fetch:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*),Bash(git switch:*),Bash(git checkout:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(git grep:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(dotnet:*),Bash(npm ci:*),Bash(npm test:*),Bash(npm run:*),Bash(pnpm:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git reset --hard:*),Bash(git clean:*),Bash(git merge:*),Bash(gh pr merge:*),Bash(gh repo delete:*),Bash(sudo:*),Bash(ssh:*),Bash(scp:*)"

      - name: Resolve Claude's implementation branch
        id: branch
        if: success() && steps.claim.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_BRANCH: ${{ steps.claude.outputs.branch_name }}
          RECOVERED_BRANCH: ${{ steps.recovery.outputs.name }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          resolved="${RECOVERED_BRANCH}"
          if [ -z "${resolved}" ]; then
            resolved="$(bash .github/scripts/find-cloud-mule-implementation-branch.sh \
              "${ISSUE_NUMBER}" "${ACTION_BRANCH}")"
          fi

          if [ -n "${resolved}" ]; then
            bash .github/scripts/refresh-cloud-mule-implementation-branch.sh "${resolved}" >/dev/null
          fi

          echo "name=${resolved}" >> "${GITHUB_OUTPUT}"

      - name: Open a draft pull request
        if: success() && steps.claim.outputs.skip == 'false' && steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail

          CLAUDE_BRANCH="$(bash .github/scripts/normalize-cloud-mule-implementation-branch.sh \
            "${ISSUE_NUMBER}" "${CLAUDE_BRANCH}")"

          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${CLAUDE_BRANCH}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "${existing}" ]; then
            echo "Claude branch already has ${existing}."
            exit 0
          fi

          issue_title="$(gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json title --jq .title)"
          pr_body="$(printf "Fixes #%s.\n\nImplemented by the AC Cloud Mule Claude automation using the issue's Red -> Green -> Refactor contract.\n\nThis PR must pass Cloud Mule CI and an independent Claude review using the pinned code-review skill for its current SHA. The implementation agent must not merge it." "${ISSUE_NUMBER}")"
          pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --draft --head "${CLAUDE_BRANCH}" --base master \
            --title "${issue_title}" \
            --body "${pr_body}")"

          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Claude opened ${pr_url}. It remains draft pending CI and independent Claude review."
          if ! gh workflow run cloud-mule-ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${CLAUDE_BRANCH}"; then
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Initial CI dispatch failed; waking the reconciler immediately. The PR remains in progress."
            gh workflow run cloud-mule-reconcile.yml --repo "${GITHUB_REPOSITORY}" --ref master
          fi

      - name: Stop safely if Claude produced no branch
        if: success() && steps.claim.outputs.skip == 'false' && steps.branch.outputs.name == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        shell: bash
        run: |
          set -euo pipefail
          result=''
          if [ -n "${EXECUTION_FILE}" ] && [ -f "${EXECUTION_FILE}" ]; then
            result="$(bash .github/scripts/read-claude-execution-field.sh result "${EXECUTION_FILE}")"
          fi
          transient=false
          if grep -Eqi 'still waiting|background .*test|try again|temporar|rate limit|server-side' <<<"${result}"; then
            transient=true
          fi

          comments="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100")"
          attempts="$(jq -r "[.[][] | select(.body | contains(\"<!-- claude-implementation-substantive-failure:${ISSUE_NUMBER}:\"))] | length" <<<"${comments}")"
          transient_attempts="$(jq -r "[.[][] | select(.body | contains(\"<!-- claude-implementation-transient:${ISSUE_NUMBER}:\"))] | length" <<<"${comments}")"

          if [ "${transient}" = true ]; then
            transient_attempts=$((transient_attempts + 1))
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:needs-attention --add-label automation:in-progress --add-label automation:retry
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Claude stopped before its background work completed. This is a retryable orchestration failure and does not consume the implementation budget. <!-- claude-implementation-transient:${ISSUE_NUMBER}:${GITHUB_RUN_ID} -->"
            if [ "${transient_attempts}" -lt 3 ]; then
              gh workflow run claude.yml --repo "${GITHUB_REPOSITORY}" --ref master -f issue_number="${ISSUE_NUMBER}"
            else
              gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
                --body "Immediate transient retries are paused to avoid wasting agent tokens; the scheduled reconciler will retry without requiring human intervention."
            fi
            exit 0
          fi

          attempts=$((attempts + 1))
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Claude completed without a recoverable implementation branch. <!-- claude-implementation-substantive-failure:${ISSUE_NUMBER}:${GITHUB_RUN_ID} -->"
          if [ "${attempts}" -ge 3 ]; then
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:in-progress --remove-label automation:retry \
              --add-label automation:needs-attention
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Automation stopped after three implementation attempts produced no branch. Full output is available in run ${GITHUB_RUN_ID}; human investigation is now required."
          else
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:needs-attention --add-label automation:in-progress --add-label automation:retry
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Claude produced no implementation branch on attempt ${attempts}/3. Retrying immediately with full output enabled. Run ${GITHUB_RUN_ID}."
            gh workflow run claude.yml --repo "${GITHUB_REPOSITORY}" --ref master -f issue_number="${ISSUE_NUMBER}"
          fi

      - name: Record automation failure
        if: failure() && steps.claim.outputs.started == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        shell: bash
        run: |
          set -u
          recovered="$(bash .github/scripts/find-cloud-mule-implementation-branch.sh "${ISSUE_NUMBER}" 2>/dev/null || true)"
          refresh_conflict=false
          if [ -n "${recovered}" ]; then
            if ! bash .github/scripts/refresh-cloud-mule-implementation-branch.sh "${recovered}" >/dev/null; then
              refresh_conflict=true
            fi
            recovered="$(bash .github/scripts/normalize-cloud-mule-implementation-branch.sh \
              "${ISSUE_NUMBER}" "${recovered}" 2>/dev/null || true)"
          fi
          if [ -n "${recovered}" ]; then
            existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${recovered}" --state open --json number --jq '.[0].number // empty')"
            if [ -z "${existing_pr}" ]; then
              issue_title="$(gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json title --jq .title)"
              pr_body="$(printf "Fixes #%s.\n\nRecovered automatically after Claude pushed a valid implementation branch but its execution/handoff failed.\n\nThis PR must pass current-SHA Cloud Mule CI and independent Claude review." "${ISSUE_NUMBER}")"
              pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --draft --head "${recovered}" --base master --title "${issue_title}" --body "${pr_body}")"
              existing_pr="$(gh pr view "${pr_url}" --repo "${GITHUB_REPOSITORY}" --json number --jq .number)"
            fi
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:queued --remove-label automation:needs-attention --remove-label automation:retry \
              --add-label automation:in-progress || true
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Recovered implementation branch \`${recovered}\` as PR #${existing_pr}; the failed provider/handoff run did not consume an implementation attempt." || true
            if [ "${refresh_conflict}" = true ]; then
              gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
                --remove-label automation:in-progress --add-label automation:needs-attention || true
              gh pr comment "${existing_pr}" --repo "${GITHUB_REPOSITORY}" \
                --body "The recovered implementation is durable, but current master has a semantic merge conflict. CI was not dispatched against a stale standalone branch. Automated conflict repair is required before validation." || true
              exit 0
            fi
            gh workflow run cloud-mule-ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${recovered}" || \
              gh workflow run cloud-mule-reconcile.yml --repo "${GITHUB_REPOSITORY}" --ref master || true
            exit 0
          fi

          existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --search "Fixes #${ISSUE_NUMBER} in:body" --json number --jq '.[0].number // empty')"
          if [ -n "${existing_pr}" ]; then
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:queued --remove-label automation:needs-attention \
              --add-label automation:in-progress || true
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Implementation produced PR #${existing_pr}; a later handoff failed and will be recovered by the scheduled reconciler. Run ${GITHUB_RUN_ID}." || true
            exit 0
          fi
          result=''
          terminal_reason=''
          api_status=''
          if [ -n "${EXECUTION_FILE}" ] && [ -f "${EXECUTION_FILE}" ]; then
            result="$(bash .github/scripts/read-claude-execution-field.sh result "${EXECUTION_FILE}" 2>/dev/null || true)"
            terminal_reason="$(bash .github/scripts/read-claude-execution-field.sh terminal_reason "${EXECUTION_FILE}" 2>/dev/null || true)"
            api_status="$(bash .github/scripts/read-claude-execution-field.sh api_error_status "${EXECUTION_FILE}" 2>/dev/null || true)"
          fi
          transient=false
          if [ "${terminal_reason}" = api_error ] || [[ "${api_status}" =~ ^(429|5[0-9][0-9])$ ]] || \
             grep -Eqi 'try again|temporar|rate limit|server-side' <<<"${result}"; then
            transient=true
          fi

          comments="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" 2>/dev/null || echo '[]')"
          attempts="$(jq -r "[.[][] | select(.body | contains(\"<!-- claude-implementation-substantive-failure:${ISSUE_NUMBER}:\"))] | length" <<<"${comments}" 2>/dev/null || echo 0)"
          transient_attempts="$(jq -r "[.[][] | select(.body | contains(\"<!-- claude-implementation-transient:${ISSUE_NUMBER}:\"))] | length" <<<"${comments}" 2>/dev/null || echo 0)"
          if [ "${transient}" = true ]; then
            transient_attempts=$((transient_attempts + 1))
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:queued --remove-label automation:needs-attention \
              --add-label automation:in-progress --add-label automation:retry || true
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Claude provider/API failure is transient and does not consume the implementation budget. <!-- claude-implementation-transient:${ISSUE_NUMBER}:${GITHUB_RUN_ID} -->" || true
            if [ "${transient_attempts}" -lt 3 ]; then
              gh workflow run claude.yml --repo "${GITHUB_REPOSITORY}" --ref master -f issue_number="${ISSUE_NUMBER}" || true
            fi
            exit 0
          fi

          attempts=$((attempts + 1))
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Claude implementation failed without producing a recoverable branch. <!-- claude-implementation-substantive-failure:${ISSUE_NUMBER}:${GITHUB_RUN_ID} -->" || true
          if [ "${attempts}" -ge 3 ]; then
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:queued --remove-label automation:in-progress --remove-label automation:retry \
              --add-label automation:needs-attention || true
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Automation stopped after three failed implementation attempts. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." || true
          else
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:queued --remove-label automation:needs-attention \
              --add-label automation:in-progress --add-label automation:retry || true
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "Claude implementation attempt ${attempts}/3 failed and will retry immediately. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." || true
            gh workflow run claude.yml --repo "${GITHUB_REPOSITORY}" --ref master -f issue_number="${ISSUE_NUMBER}" || true
          fi
