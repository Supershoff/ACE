name: Claude implementation

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Dependency-ready issue number to implement
        required: true
        type: string

concurrency:
  group: claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  interactive:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.issue.pull_request == null &&
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
    uses: Supershoff/.github/.github/workflows/claude-implement.yml@a08297589d9f215c8456219094659e9922177587
    with:
      max_turns: 300
    secrets: inherit

  automated-implementation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read

    steps:
      - name: Validate and claim the requested issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail

          issue_json="$(gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json state,labels,title,body)"
          [ "$(jq -r .state <<<"${issue_json}")" = "OPEN" ] || { echo "Issue is not open."; exit 1; }
          jq -e '[.labels[].name] | any(. == "ready-for-agent")' <<<"${issue_json}" >/dev/null
          if jq -e '[.labels[].name] | any(. == "automation:needs-attention" or . == "ready-for-human")' <<<"${issue_json}" >/dev/null; then
            echo "Issue is intentionally blocked from autonomous implementation."
            exit 1
          fi

          dependency_block="$(sed -n '/^## Dependencies$/,/^## Red/p' <<<"$(jq -r .body <<<"${issue_json}")")"
          while read -r dependency; do
            [ -n "${dependency}" ] || continue
            state="$(gh issue view "${dependency}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)"
            [ "${state}" = "CLOSED" ] || { echo "Dependency #${dependency} is ${state}."; exit 1; }
          done < <(grep -oE '#[0-9]+' <<<"${dependency_block}" | tr -d '#' || true)

          gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --add-label automation:in-progress --remove-label automation:queued --remove-label automation:retry

      - name: Checkout complete repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run Claude Code for the issue
        id: claude
        uses: anthropics/claude-code-action@62529b7c89dbb8cfaa838f2c87f2f8459b46fe68 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: master
          branch_prefix: claude/
          prompt: >-
            Implement GitHub issue #${{ inputs.issue_number }} completely. First read the issue with
            gh issue view, then read AGENTS.md, CLAUDE.md, CONTEXT.md, IMPLEMENTATION-BRIEF.md,
            applicable ADRs, and docs/agents/automation.md. Follow the issue's Red → Green → Refactor
            sequence: demonstrate failing tests before production behavior, implement only the issue,
            run every relevant available check, and report exact commands/results. Do not weaken,
            skip, or misreport checks. Preserve unrelated work, private DAT boundaries, custody
            invariants, and authority boundaries. Commit and push your branch, but never merge it.
          additional_permissions: |
            actions: read
            checks: read
          claude_args: |
            --max-turns 300
            --append-system-prompt "Work on exactly one issue. If a required prerequisite is unavailable or an acceptance criterion cannot be verified, stop and report it instead of claiming completion."
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git fetch:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(npm ci:*),Bash(npm test:*),Bash(npm run:*),Bash(pnpm:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git reset --hard:*),Bash(git clean:*),Bash(git merge:*),Bash(gh pr merge:*),Bash(gh repo delete:*),Bash(sudo:*),Bash(ssh:*),Bash(scp:*)"

      - name: Open a draft pull request
        if: success() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail

          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${CLAUDE_BRANCH}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "${existing}" ]; then
            echo "Claude branch already has ${existing}."
            exit 0
          fi

          issue_title="$(gh issue view "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json title --jq .title)"
          pr_body="$(printf "Fixes #%s.\n\nImplemented by the AC Cloud Mule Claude automation using the issue's Red -> Green -> Refactor contract.\n\nThis PR must pass Cloud Mule CI and Codex review for its current SHA. Claude must not merge it." "${ISSUE_NUMBER}")"
          pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --draft --head "${CLAUDE_BRANCH}" --base master \
            --title "${issue_title}" \
            --body "${pr_body}")"

          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Claude opened ${pr_url}. It remains draft pending CI and Codex review."

      - name: Stop safely if Claude produced no branch
        if: success() && steps.claude.outputs.branch_name == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --remove-label automation:in-progress --add-label automation:needs-attention
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Claude completed without producing an implementation branch. Automation stopped for investigation."

      - name: Record automation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --remove-label automation:queued --remove-label automation:in-progress \
            --add-label automation:needs-attention || true
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Claude automation failed and stopped safely. Inspect run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." || true
