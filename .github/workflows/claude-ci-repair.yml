name: Claude CI repair

on:
  workflow_run:
    workflows: [Cloud Mule CI]
    types: [completed]

concurrency:
  group: claude-ci-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve the failed PR and enforce the repair limit
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${HEAD_BRANCH}" --state open \
            --json number,headRefOid,body --jq '.[0] // empty')"
          [ -n "${pr_json}" ] || { echo 'No open PR owns the failed Claude branch.'; exit 1; }
          pr_number="$(jq -r .number <<<"${pr_json}")"
          head_sha="$(jq -r .headRefOid <<<"${pr_json}")"
          issue_number="$(sed -nE 's/.*(Fixes|Closes|Resolves) #([0-9]+).*/\2/p' <<<"$(jq -r .body <<<"${pr_json}")" | head -n 1)"
          [ -n "${issue_number}" ] || { echo 'PR has no linked issue.'; exit 1; }

          count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100" \
            --jq '[.[] | select(.body | contains("<!-- claude-ci-repair:"))] | length')"
          if [ "${count}" -ge 3 ]; then
            gh issue edit "${issue_number}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:in-progress --add-label automation:needs-attention
            gh pr comment "${pr_number}" --repo "${GITHUB_REPOSITORY}" \
              --body 'Automation stopped after three failed CI repair cycles. Human investigation is required.'
            echo 'repair_allowed=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          next=$((count + 1))
          marker="<!-- claude-ci-repair:${next}:${head_sha} -->"
          body="$(printf 'CI failed for `%s`; Claude repair cycle %s/3 is starting.\n\n%s' "${head_sha}" "${next}" "${marker}")"
          gh pr comment "${pr_number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          echo 'repair_allowed=true' >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "issue_number=${issue_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "failed_run_id=${FAILED_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the failed PR branch
        if: steps.context.outputs.repair_allowed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Let Claude diagnose and repair CI
        if: steps.context.outputs.repair_allowed == 'true'
        id: claude
        uses: anthropics/claude-code-action@62529b7c89dbb8cfaa838f2c87f2f8459b46fe68 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions
          base_branch: ${{ github.event.workflow_run.head_branch }}
          branch_prefix: claude/ci-repair-
          prompt: >-
            Repair the failed Cloud Mule CI run ${{ steps.context.outputs.failed_run_id }} for PR
            #${{ steps.context.outputs.pr_number }} on its existing branch. Read the linked issue,
            AGENTS.md, the PR diff, and the complete failed-job logs. Add or preserve regression
            evidence, make the smallest safe correction, and run the relevant checks. Treat missing
            infrastructure as a CI design problem; never skip a required check or report an unavailable
            check as passing. Commit and push the correction, but do not merge the PR.
          additional_permissions: |
            actions: read
            checks: read
          claude_args: |
            --max-turns 160
            --append-system-prompt "Fix only the observed CI failure on the existing PR. Preserve issue scope and all safety invariants."
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git fetch:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(dotnet new:*),Bash(dotnet sln:*),Bash(dotnet add:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(npm ci:*),Bash(npm test:*),Bash(npm run:*),Bash(pnpm:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git reset --hard:*),Bash(git clean:*),Bash(git merge:*),Bash(gh pr merge:*),Bash(gh repo delete:*),Bash(sudo:*),Bash(ssh:*),Bash(scp:*)"

      - name: Promote a Claude-created repair branch onto the existing PR
        if: >-
          steps.context.outputs.repair_allowed == 'true' &&
          success() &&
          steps.claude.outputs.branch_name != '' &&
          steps.claude.outputs.branch_name != github.event.workflow_run.head_branch
        env:
          REPAIR_BRANCH: ${{ steps.claude.outputs.branch_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ORIGINAL_SHA: ${{ steps.context.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${REPAIR_BRANCH}" "${HEAD_BRANCH}"
          repair_sha="$(git rev-parse "origin/${REPAIR_BRANCH}")"
          git merge-base --is-ancestor "${ORIGINAL_SHA}" "${repair_sha}" || {
            echo 'Repair branch is not a safe fast-forward of the reviewed PR head.'
            exit 1
          }
          git push origin "${repair_sha}:refs/heads/${HEAD_BRANCH}"

      - name: Record repair workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        shell: bash
        run: |
          [ -n "${ISSUE_NUMBER}" ] || exit 0
          gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --remove-label automation:in-progress --add-label automation:needs-attention || true
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Claude CI repair failed. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." || true
