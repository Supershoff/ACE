name: Cloud Mule reconciler

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: cloud-mule-reconciler
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUD_MULE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recover every open Claude pull request from durable state
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_ENABLED: ${{ vars.CLOUD_MULE_AUTOMATION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail

          merged_prs="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --limit 100 --json number,body)"
          gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label ready-for-agent --limit 100 \
            --json number --jq '.[].number' |
          while read -r issue; do
            completed_pr="$(jq -r --arg issue "${issue}" \
              'first(.[] | select(.body | test("(Fixes|Closes|Resolves) #" + $issue + "([^0-9]|$)"))) | .number // empty' \
              <<<"${merged_prs}")"
            [ -n "${completed_pr}" ] || continue
            gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:queued --remove-label automation:in-progress \
              --remove-label automation:retry --remove-label automation:needs-attention \
              --add-label automation:ready-for-user-testing >/dev/null
            gh issue close "${issue}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Reconciled as completed by merged PR #${completed_pr}." >/dev/null
          done

          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,headRefName,headRefOid,body,isDraft --jq '.[] | @base64' |
          while read -r encoded; do
            pr="$(base64 -d <<<"${encoded}")"
            branch="$(jq -r .headRefName <<<"${pr}")"
            [[ "${branch}" == claude/* ]] || continue
            number="$(jq -r .number <<<"${pr}")"
            sha="$(jq -r .headRefOid <<<"${pr}")"
            issue="$(sed -nE 's/.*(Fixes|Closes|Resolves) #([0-9]+).*/\2/p' <<<"$(jq -r .body <<<"${pr}")" | head -n 1)"
            [ -n "${issue}" ] || continue

            stopped="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" \
              --jq '[.[][] | select(.body | contains("Automation stopped after three"))] | length')"
            [ "${stopped}" -eq 0 ] || continue

            gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:needs-attention --remove-label automation:queued \
              --add-label automation:in-progress >/dev/null

            review="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" \
              --jq "[.[][] | select(.body | contains(\"<!-- claude-code-review:${sha} -->\"))] | last // empty")"
            if [ -n "${review}" ]; then
              review_body="$(jq -r .body <<<"${review}")"
              if grep -q '^VERDICT: CLEAN' <<<"${review_body}"; then
                human_gate="$(gh issue view "${issue}" --repo "${GITHUB_REPOSITORY}" --json labels \
                  --jq '[.labels[].name] | any(. == "automation:human-gate")')"
                gh pr ready "${number}" --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
                if [ "${human_gate}" = true ] || [ "${AUTOMATION_ENABLED}" != true ]; then
                  gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" \
                    --remove-label automation:in-progress --add-label automation:ready-for-user-testing >/dev/null
                else
                  gh pr merge "${number}" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch
                  gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" \
                    --remove-label automation:queued --remove-label automation:in-progress \
                    --remove-label automation:retry --remove-label automation:needs-attention \
                    --add-label automation:ready-for-user-testing >/dev/null
                  gh issue close "${issue}" --repo "${GITHUB_REPOSITORY}" \
                    --comment "Completed by merged PR #${number} after exact-SHA CI and a clean independent Claude review." >/dev/null
                fi
              elif grep -q '^VERDICT: BLOCKING' <<<"${review_body}"; then
                reviewed_at="$(date -d "$(jq -r .created_at <<<"${review}")" +%s)"
                now="$(date +%s)"
                if [ $((now - reviewed_at)) -ge 6000 ]; then
                  gh workflow run claude-review.yml --repo "${GITHUB_REPOSITORY}" --ref master \
                    -f head_branch="${branch}" -f tested_sha="${sha}" -f retry_existing=true
                fi
              fi
              continue
            fi

            runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/cloud-mule-ci.yml/runs?branch=${branch}&per_page=100")"
            current="$(jq -c --arg sha "${sha}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"${runs}")"
            if [ -z "${current}" ]; then
              gh workflow run cloud-mule-ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${branch}"
              continue
            fi

            status="$(jq -r .status <<<"${current}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${current}")"
            run_id="$(jq -r .id <<<"${current}")"
            [ "${status}" = completed ] || continue
            if [ "${conclusion}" = success ]; then
              gh workflow run claude-review.yml --repo "${GITHUB_REPOSITORY}" --ref master \
                -f head_branch="${branch}" -f tested_sha="${sha}"
            else
              repair_for_sha="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" \
                --jq "[.[][] | select(.body | contains(\"${sha} -->\")) | select(.body | contains(\"<!-- claude-ci-repair:\"))] | length")"
              [ "${repair_for_sha}" -gt 0 ] || gh workflow run claude-ci-repair.yml --repo "${GITHUB_REPOSITORY}" --ref master \
                -f head_branch="${branch}" -f failed_sha="${sha}" -f failed_run_id="${run_id}"
            fi
          done

          open_prs="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 --json body)"
          gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label ready-for-agent --limit 100 \
            --json number,labels,comments,updatedAt --jq '.[] | @base64' |
          while read -r encoded; do
            issue_json="$(base64 -d <<<"${encoded}")"
            issue="$(jq -r .number <<<"${issue_json}")"
            has_state="$(jq '[.labels[].name] | any(. == "automation:queued" or . == "automation:in-progress" or . == "automation:needs-attention")' <<<"${issue_json}")"
            [ "${has_state}" = true ] || continue
            has_pr="$(jq --arg issue "${issue}" '[.[] | select(.body | test("(Fixes|Closes|Resolves) #" + $issue + "([^0-9]|$)"))] | length' <<<"${open_prs}")"
            [ "${has_pr}" -eq 0 ] || continue

            starts="$(jq -r --arg issue "${issue}" '[.comments[].body | select(contains("<!-- claude-implementation-start:" + $issue + ":"))] | length' <<<"${issue_json}")"
            if [ "${starts}" -ge 3 ]; then
              gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" \
                --remove-label automation:queued --remove-label automation:in-progress --add-label automation:needs-attention >/dev/null
              continue
            fi

            last_start="$(jq -r --arg issue "${issue}" '[.comments[].body | select(contains("<!-- claude-implementation-start:" + $issue + ":"))] | last // empty' <<<"${issue_json}")"
            if [ -n "${last_start}" ]; then
              run_id="$(sed -nE 's/.*claude-implementation-start:[0-9]+:([0-9]+).*/\1/p' <<<"${last_start}")"
              run_status="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json status --jq .status 2>/dev/null || echo completed)"
              if [ "${run_status}" = queued ] || [ "${run_status}" = in_progress ]; then
                continue
              fi
            else
              updated_at="$(date -d "$(jq -r .updatedAt <<<"${issue_json}")" +%s)"
              now="$(date +%s)"
              if [ $((now - updated_at)) -lt 1200 ]; then
                continue
              fi
            fi

            gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" \
              --remove-label automation:needs-attention --remove-label automation:queued --add-label automation:in-progress >/dev/null
            gh workflow run claude.yml --repo "${GITHUB_REPOSITORY}" --ref master -f issue_number="${issue}"
          done

          active_prs="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("claude/"))] | length')"
          active_issues="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label ready-for-agent --limit 100 \
            --json labels --jq '[.[] | select([.labels[].name] | any(. == "automation:queued" or . == "automation:in-progress"))] | length')"
          if [ "${active_prs}" -eq 0 ] && [ "${active_issues}" -eq 0 ]; then
            gh workflow run cloud-mule-orchestrator.yml --repo "${GITHUB_REPOSITORY}" --ref master -f dry_run=false
          fi
