name: Request Codex review

on:
  workflow_run:
    workflows: [Cloud Mule CI]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  request-review:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request one Codex review for the tested PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${HEAD_BRANCH}" == claude/* ]] || { echo "Not a Claude branch."; exit 0; }

          pr_json="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${HEAD_BRANCH}" --state open \
            --json number,headRefOid --jq '.[0] // empty')"
          [ -n "${pr_json}" ] || exit 0
          pr_number="$(jq -r .number <<<"${pr_json}")"
          head_sha="$(jq -r .headRefOid <<<"${pr_json}")"

          marker="<!-- codex-auto-review:${head_sha} -->"
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id")"
          [ -z "${existing}" ] || { echo "Codex already requested for ${head_sha}."; exit 0; }

          body="$(printf '@codex review using the AGENTS.md Code Review Rules and the linked issue acceptance criteria. Focus on P0/P1 correctness, custody, concurrency, authorization, privacy, and missing-test defects.\n\n%s' "${marker}")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
            --raw-field body="${body}" --silent

          gh pr comment "${pr_number}" --repo "${GITHUB_REPOSITORY}" \
            --body "CI passed for ${head_sha}; requested Codex review for this exact revision."
